<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVORO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="AVORO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B1A18">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
html,body{height:100%;margin:0}
body{background:#1B1A18;color:#FAF8F5;font-family:-apple-system,system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
img{width:84px;height:84px;border-radius:20px}
h1{font-family:Georgia,serif;font-weight:400;font-size:1.8rem;margin:18px 0 6px}
p{color:#A39A8C;font-size:.95rem;margin:0 0 26px;line-height:1.5}
a{display:inline-block;background:#FAF8F5;color:#1B1A18;text-decoration:none;padding:14px 28px;border-radius:10px;font-weight:600;letter-spacing:.04em}
small{display:block;margin-top:22px;color:#6F685E;font-size:.78rem;line-height:1.5}
</style>
</head>
<body>
<div>
  <img src="/apple-touch-icon.png" alt="AVORO">
  <h1>Klantenjacht</h1>
  <p>Je CRM wordt geopend…</p>
  <a id="go" href="https://claude.ai/artifact/2Ycb8DhLsQvhpCBRtTwUAw">Open CRM</a>
  <small id="tip" hidden>Tip: tik op Delen ⬆︎ en kies<br>"Zet op beginscherm" voor het AVORO-icoon.</small>
</div>
<script>
var url="https://claude.ai/artifact/2Ycb8DhLsQvhpCBRtTwUAw";
var standalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
if(standalone||/[?&]open\b/.test(location.search)){location.replace(url)}
else{document.querySelector("p").textContent="Tik op de knop om je CRM te openen.";document.getElementById("tip").hidden=false}
</script>
</body>
</html>
